<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesoreros SG</title>
    <meta name="description" content="Control de cuotas, pagos y gastos del fondo de curso." />
    <meta name="theme-color" content="#0f2a44" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f2a44'/%3E%3Cpath d='M9 22V10h6.5a3.5 3.5 0 010 7H9m0 0h8a3 3 0 010 6H9' fill='none' stroke='%23c9992a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #14202e;
        --ink-soft: #3d4d5f;
        --muted: #66768a;
        --bg: #eef2f6;
        --surface: #ffffff;
        --line: #dbe3ec;
        --navy: #0f2a44;
        --navy-2: #1a4166;
        --accent: #c9992a;
        --accent-soft: #f6ecd0;
        --success: #2a7d46;
        --danger: #b42318;
        --shadow: 0 1px 2px rgba(15, 42, 68, .06), 0 12px 32px -12px rgba(15, 42, 68, .18);
        --ease: cubic-bezier(.22, 1, .36, 1);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(900px 420px at 85% -10%, rgba(26, 65, 102, .10), transparent 70%),
          var(--bg);
        color: var(--ink);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .skip-link {
        position: absolute; left: 1rem; top: -4rem;
        background: var(--navy); color: #fff; padding: .6rem .9rem; border-radius: 8px;
        z-index: 10; transition: top .2s var(--ease);
      }
      .skip-link:focus { top: 1rem; }
      .wrap { max-width: 1160px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
      .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }

      h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 600; letter-spacing: -.03em; line-height: 1.1; text-wrap: balance; }
      h2 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
      .subtitle { margin: .5rem 0 1.5rem; color: var(--muted); }

      /* Login */
      .login { max-width: 420px; margin: min(14vh, 7rem) auto 0; padding: 2.25rem 2rem 2rem; border-top: 3px solid var(--accent); }
      .login .subtitle { margin-bottom: 1.75rem; }

      /* Forms */
      .field { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
      label { font-weight: 500; font-size: .875rem; color: var(--ink-soft); }
      input {
        width: 100%; padding: .7rem .8rem; font: inherit; color: var(--ink);
        background: #f8fafc; border: 1px solid var(--line); border-radius: 10px;
        transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
      }
      input[type="number"] { font-variant-numeric: tabular-nums; }
      input:hover { border-color: #c3cfdc; }
      input:focus-visible { outline: none; background: #fff; border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(26, 65, 102, .18); }

      /* Buttons */
      button { font: inherit; cursor: pointer; }
      .btn {
        border: 0; background: var(--navy); color: #fff; padding: .72rem 1.05rem;
        border-radius: 10px; font-weight: 600; letter-spacing: -.005em;
        transition: background .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
      }
      .btn:hover { background: var(--navy-2); box-shadow: 0 6px 16px -6px rgba(15, 42, 68, .5); }
      .btn:active { transform: translateY(1px) scale(.98); }
      .btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .btn-block { width: 100%; }
      .btn-ghost { background: transparent; color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--line); }
      .btn-ghost:hover { background: #f1f5f9; box-shadow: inset 0 0 0 1px #c3cfdc; }
      .btn-on-dark { background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
      .btn-on-dark:hover { background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
      .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }

      /* Topbar */
      .topbar {
        background: linear-gradient(135deg, var(--navy) 0%, #12365a 100%);
        color: #fff; padding: 1.5rem 1.6rem 1.6rem; border-radius: 16px;
        display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
        box-shadow: 0 20px 40px -24px rgba(15, 42, 68, .7);
      }
      .topbar .subtitle { margin: .45rem 0 0; color: #b9cbe0; }
      .topbar .subtitle strong { color: #fff; font-weight: 600; }
      .badge {
        background: var(--accent-soft); color: #5c4310; padding: .3rem .65rem;
        border-radius: 6px; font-size: .8rem; font-weight: 600; letter-spacing: .01em;
      }

      /* Tabs */
      .tabs { display: flex; overflow-x: auto; gap: .25rem; margin: 1rem 0 1.25rem; padding-bottom: .25rem; border-bottom: 1px solid var(--line); scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab {
        background: none; border: 0; color: var(--muted); padding: .6rem .85rem; white-space: nowrap;
        font-size: .92rem; font-weight: 500; border-radius: 8px 8px 0 0; position: relative;
        transition: color .2s var(--ease), background .2s var(--ease);
      }
      .tab:hover:not([aria-disabled="true"]) { color: var(--ink); background: rgba(255,255,255,.6); }
      .tab[aria-current="page"] { color: var(--navy); font-weight: 600; }
      .tab[aria-current="page"]::after { content: ""; position: absolute; left: .85rem; right: .85rem; bottom: -.3rem; height: 2px; background: var(--accent); border-radius: 2px; }
      .tab[aria-disabled="true"] { cursor: not-allowed; opacity: .55; }
      .tab-flag { color: var(--danger); }

      /* Layout */
      .grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 1.25rem; align-items: start; }
      .panel { padding: 1.5rem; }
      .panel-head { margin-bottom: 1.25rem; }
      .panel-head .hint { margin: .2rem 0 0; }
      .hint { color: var(--muted); font-size: .9rem; margin: 0; }

      /* Metrics */
      .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .metric { padding: 1rem 0 0; }
      .metric small { color: var(--muted); font-size: .8rem; font-weight: 500; }
      .metric strong { display: block; margin-top: .2rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
      .metric-main { grid-column: 1 / -1; padding: 0 0 1.25rem; border-top: 0; border-bottom: 1px solid var(--line); }
      .metric-main strong { font-size: clamp(2.4rem, 6vw, 3.4rem); letter-spacing: -.04em; line-height: 1.05; }
      .metric-in strong { color: var(--success); }
      .metric-out strong { color: var(--ink); }

      .form-error { color: var(--danger); font-size: .88rem; margin: -.25rem 0 1rem; }
      .form-ok { color: var(--success); font-size: .88rem; font-weight: 500; margin: .9rem 0 0; }
      .hidden { display: none !important; }
      .settings-form .row { margin-top: .5rem; }

      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <main class="wrap" id="contenido">
      <section id="login" class="card login">
        <h1 id="login-title">Tesoreros SG</h1>
        <p id="login-school" class="subtitle">Saint George's College</p>
        <div class="field">
          <label for="pin">PIN</label>
          <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Ingresa el PIN" aria-describedby="pin-error" />
        </div>
        <p id="pin-error" class="form-error hidden" role="alert">PIN incorrecto. Intenta de nuevo.</p>
        <button id="login-btn" class="btn btn-block">Ingresar</button>
      </section>

      <section id="dashboard" class="hidden">
        <header class="topbar card">
          <div>
            <h1 id="app-title">Tesoreros SG</h1>
            <p class="subtitle">
              <span id="app-school">Saint George's College</span> · Curso <strong id="curso">4B</strong>
            </p>
          </div>
          <div class="row">
            <span class="badge">Delegados Público</span>
            <button id="logout-btn" class="btn btn-on-dark">Cerrar sesión</button>
          </div>
        </header>

        <nav class="tabs" aria-label="Secciones">
          <button class="tab" type="button" aria-current="page">Resumen</button>
          <button class="tab" type="button" aria-disabled="true" title="Próximamente">Cuotas</button>
          <button class="tab" type="button" aria-disabled="true" title="Próximamente">Pagos</button>
          <button class="tab" type="button" aria-disabled="true" title="Próximamente">Gastos</button>
          <button class="tab" type="button" aria-disabled="true" title="Próximamente">Alumnos</button>
          <button class="tab" type="button" aria-disabled="true" title="Próximamente"><span class="tab-flag" aria-hidden="true">●</span> Pendientes</button>
          <button class="tab" type="button" aria-disabled="true" title="Próximamente">Reportes</button>
          <button class="tab" type="button" aria-disabled="true" title="Próximamente">Log</button>
        </nav>

        <div class="grid">
          <section class="card panel" aria-labelledby="h-resumen">
            <div class="panel-head">
              <h2 id="h-resumen">Resumen</h2>
              <p class="hint">Vista general del fondo</p>
            </div>
            <div class="metrics">
              <div class="metric metric-main"><small>Saldo actual</small><strong id="saldo">$ 0</strong></div>
              <div class="metric metric-in"><small>Total recaudado</small><strong id="recaudado">$ 0</strong></div>
              <div class="metric metric-out"><small>Total gastado</small><strong id="gastado">$ 0</strong></div>
            </div>
          </section>

          <aside class="card panel" aria-labelledby="h-campos">
            <div class="panel-head"><h2 id="h-campos">Campos editables</h2></div>
            <form id="settings-form" class="settings-form">
              <div class="field">
                <label for="title">Título de la app</label>
                <input id="title" />
              </div>
              <div class="field">
                <label for="school">Colegio</label>
                <input id="school" />
              </div>
              <div class="field">
                <label for="delegates">Texto delegados</label>
                <input id="delegates" />
              </div>
              <div class="field">
                <label for="curso-input">Curso</label>
                <input id="curso-input" />
              </div>
              <div class="field">
                <label for="saldo-input">Saldo actual</label>
                <input id="saldo-input" type="number" />
              </div>
              <div class="field">
                <label for="recaudado-input">Total recaudado</label>
                <input id="recaudado-input" type="number" />
              </div>
              <div class="field">
                <label for="gastado-input">Total gastado</label>
                <input id="gastado-input" type="number" />
              </div>
              <div class="row">
                <button type="submit" class="btn">Guardar cambios</button>
                <button id="reset-btn" type="button" class="btn btn-ghost">Restaurar datos</button>
              </div>
            </form>
            <p id="saved" class="form-ok hidden" role="status">Cambios guardados</p>
          </aside>
        </div>
      </section>
    </main>

    <script>
      const defaultConfig = {
        pin: "1234",
        title: "Tesoreros SG",
        school: "Saint George's College",
        delegates: "Delegados Público",
        curso: "4B",
        saldo: 0,
        recaudado: 0,
        gastado: 0
      };

      const params = new URLSearchParams(window.location.search);
      const stored = JSON.parse(localStorage.getItem("tesoreros-config") || "null");
      const config = { ...defaultConfig, ...stored };
      if (params.get("curso")) config.curso = params.get("curso").toUpperCase();

      const login = document.getElementById("login");
      const dashboard = document.getElementById("dashboard");
      const pinError = document.getElementById("pin-error");
      const delegatesBadge = document.querySelector('.badge');

      function currency(value) {
        return "$ " + Number(value || 0).toLocaleString("es-CL");
      }

      function render() {
        document.getElementById("login-title").textContent = config.title;
        document.getElementById("login-school").textContent = config.school;
        document.getElementById("app-title").textContent = config.title;
        document.getElementById("app-school").textContent = config.school;
        document.getElementById("curso").textContent = config.curso;
        delegatesBadge.textContent = config.delegates;
        document.getElementById("saldo").textContent = currency(config.saldo);
        document.getElementById("recaudado").textContent = currency(config.recaudado);
        document.getElementById("gastado").textContent = currency(config.gastado);

        document.getElementById("title").value = config.title;
        document.getElementById("school").value = config.school;
        document.getElementById("delegates").value = config.delegates;
        document.getElementById("curso-input").value = config.curso;
        document.getElementById("saldo-input").value = config.saldo;
        document.getElementById("recaudado-input").value = config.recaudado;
        document.getElementById("gastado-input").value = config.gastado;
      }

      render();

      document.getElementById("login-btn").addEventListener("click", () => {
        if (document.getElementById("pin").value === config.pin) {
          login.classList.add("hidden");
          dashboard.classList.remove("hidden");
          pinError.classList.add("hidden");
        } else {
          pinError.classList.remove("hidden");
        }
      });

      document.getElementById("pin").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("login-btn").click();
      });

      document.getElementById("logout-btn").addEventListener("click", () => {
        document.getElementById("pin").value = "";
        dashboard.classList.add("hidden");
        login.classList.remove("hidden");
      });

      document.getElementById("settings-form").addEventListener("submit", (e) => {
        e.preventDefault();
        config.title = document.getElementById("title").value.trim() || defaultConfig.title;
        config.school = document.getElementById("school").value.trim() || defaultConfig.school;
        config.delegates = document.getElementById("delegates").value.trim() || defaultConfig.delegates;
        config.curso = (document.getElementById("curso-input").value.trim() || defaultConfig.curso).toUpperCase();
        config.saldo = Number(document.getElementById("saldo-input").value || 0);
        config.recaudado = Number(document.getElementById("recaudado-input").value || 0);
        config.gastado = Number(document.getElementById("gastado-input").value || 0);

        localStorage.setItem("tesoreros-config", JSON.stringify(config));
        render();

        const saved = document.getElementById("saved");
        saved.classList.remove("hidden");
        setTimeout(() => saved.classList.add("hidden"), 1400);
      });

      document.getElementById("reset-btn").addEventListener("click", () => {
        localStorage.removeItem("tesoreros-config");
        Object.assign(config, defaultConfig);
        if (params.get("curso")) config.curso = params.get("curso").toUpperCase();
        render();
      });
    </script>
  </body>
</html>
